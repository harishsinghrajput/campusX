<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusX - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex align-items-center justify-content-center vh-100">
    <div class="card p-4 bg-dark text-white border-secondary" style="max-width: 400px; width: 100%;">
        <h3 class="text-center fw-bold text-primary mb-3">CampusX Login</h3>
        <form onsubmit="event.preventDefault(); alert('Logged in successfully!'); window.location.href='index.html';">
            <div class="mb-3">
                <label class="form-label">Email address</label>
                <input type="email" class="form-control bg-secondary text-white border-0" required placeholder="student@campus.edu">
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control bg-secondary text-white border-0" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary w-100">Sign In</button>
        </form>
        <p class="text-center text-white-50 mt-3 mb-0">Don't have an account? <a href="signup.html" class="text-primary">Sign up</a></p>
    </div>
</body>
</html>
