<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusX - Resources Vault</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>

    <div class="sidebar">
        <h3 class="text-white fw-bold mb-4"><i class="fa-solid fa-graduation-cap text-primary me-2"></i>CampusX</h3>
        <ul class="nav nav-pills flex-column">
            <li class="nav-item"><a href="index.html" class="nav-link"><i class="fa-solid fa-house me-2"></i>Dashboard</a></li>
            <li class="nav-item"><a href="resources.html" class="nav-link active"><i class="fa-solid fa-folder-open me-2"></i>Resources</a></li>
            <li class="nav-item"><a href="login.html" class="nav-link"><i class="fa-solid fa-right-to-bracket me-2"></i>Login</a></li>
            <li class="nav-item"><a href="signup.html" class="nav-link"><i class="fa-solid fa-user-plus me-2"></i>Signup</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h2 class="fw-bold mb-1">Academic Resources Vault 📂</h2>
                <p class="text-white-50 mb-0">Pre-loaded academic materials & student shared resources.</p>
            </div>
            <!-- Upload Button -->
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#uploadModal">
                <i class="fa-solid fa-cloud-arrow-up me-2"></i>Upload Resource
            </button>
        </div>

        <!-- Dynamic Grid where Pre-resources & User Uploads appear -->
        <div class="row g-4" id="resourceGrid"></div>
    </div>

    <!-- Upload Resource Modal -->
    <div class="modal fade" id="uploadModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-white border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title"><i class="fa-solid fa-file-circle-plus text-success me-2"></i>Upload Study Material</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="resourceForm" onsubmit="handleResourceUpload(event)">
                        <div class="mb-3">
                            <label class="form-label">Resource Title</label>
                            <input type="text" id="resTitle" class="form-control bg-secondary text-white border-0" required placeholder="e.g. Operating Systems Lab Manual">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Subject / Semester</label>
                            <input type="text" id="resCategory" class="form-control bg-secondary text-white border-0" required placeholder="e.g. CSE - Sem 7">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea id="resDesc" class="form-control bg-secondary text-white border-0" rows="2" required placeholder="Brief overview of topic..."></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">PDF / Drive Link</label>
                            <input type="url" id="resLink" class="form-control bg-secondary text-white border-0" required placeholder="https://drive.google.com/...">
                        </div>
                        <button type="submit" class="btn btn-success w-100">Publish Resource</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
