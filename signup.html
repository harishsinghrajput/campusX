<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusX - Signup</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex align-items-center justify-content-center vh-100">
    <div class="card p-4 bg-dark text-white border-secondary" style="max-width: 400px; width: 100%;">
        <h3 class="text-center fw-bold text-success mb-3">CampusX Register</h3>
        <form onsubmit="event.preventDefault(); alert('Account created successfully!'); window.location.href='index.html';">
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control bg-secondary text-white border-0" required placeholder="Harish Singh">
            </div>
            <div class="mb-3">
                <label class="form-label">Email address</label>
                <input type="email" class="form-control bg-secondary text-white border-0" required placeholder="student@campus.edu">
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control bg-secondary text-white border-0" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-success w-100">Create Account</button>
        </form>
        <p class="text-center text-white-50 mt-3 mb-0">Already registered? <a href="login.html" class="text-success">Login</a></p>
    </div>
</body>
</html>
